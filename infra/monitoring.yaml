---
apiVersion: v1
kind: Service
metadata:
  name: pingpong-a-metrics
  namespace: pingpong-a
  labels:
    app.kubernetes.io/name: pingpong-a
spec:
  selector:
    app.kubernetes.io/name: pingpong-a
  ports:
    - name: metrics
      port: 9080
      targetPort: 9080
---
apiVersion: v1
kind: Service
metadata:
  name: pingpong-b-metrics
  namespace: pingpong-b
  labels:
    app.kubernetes.io/name: pingpong-b
spec:
  selector:
    app.kubernetes.io/name: pingpong-b
  ports:
    - name: metrics
      port: 9080
      targetPort: 9080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pingpong-a
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: ["pingpong-a"]
  selector:
    matchLabels:
      app.kubernetes.io/name: pingpong-a
  endpoints:
    - port: metrics
      path: /-/metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pingpong-b
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: ["pingpong-b"]
  selector:
    matchLabels:
      app.kubernetes.io/name: pingpong-b
  endpoints:
    - port: metrics
      path: /-/metrics
      interval: 15s

# Namespace for Linkerd control-plane and certs
apiVersion: v1
kind: Namespace
metadata:
  name: linkerd
---
# Cluster-wide self-signed issuer to mint the long-lived trust anchor
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: linkerd-selfsigned
spec:
  selfSigned: {}
---
# Create a long-lived Trust Anchor (root CA) as a Secret in the linkerd namespace
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkerd-trust-anchor
  namespace: linkerd
spec:
  isCA: true
  commonName: linkerd-trust-anchor
  secretName: linkerd-trust-anchor
  duration: 87600h        # 10 years
  renewBefore: 720h       # 30 days
  subject:
    organizations: ["linkerd"]
  privateKey:
    algorithm: ECDSA
    size: 256
  usages: ["cert sign", "crl sign", "digital signature", "key encipherment"]
  issuerRef:
    name: linkerd-selfsigned
    kind: ClusterIssuer
---
# Use the Trust Anchor as a signing CA to mint the Linkerd identity issuer (intermediate CA)
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: linkerd-trust-anchor
  namespace: linkerd
spec:
  ca:
    secretName: linkerd-trust-anchor
---
# The Linkerd identity issuer certificate (CA=true). cert-manager will rotate this for us.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkerd-identity-issuer
  namespace: linkerd
spec:
  isCA: true
  commonName: identity.linkerd.cluster.local
  secretName: linkerd-identity-issuer
  duration: 8760h        # 1 year
  renewBefore: 168h      # 7 days
  subject:
    organizations: ["linkerd"]
  privateKey:
    algorithm: ECDSA
    size: 256
  usages: ["cert sign", "crl sign", "digital signature", "key encipherment"]
  issuerRef:
    name: linkerd-trust-anchor
    kind: Issuer

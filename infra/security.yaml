kind: NetworkPolicy
metadata:
  name: allow-to-pingpong-a
  namespace: pingpong-b
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pingpong-b
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pingpong-a
      ports:
        - port: 8080
